<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 210" width="470" height="210"
     font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">

  <!-- editable mesh: one shared vertex, two corners -->
  <text x="10" y="18" fill="#8b949e" font-weight="600">editable mesh</text>
  <text x="10" y="34" fill="#8b949e" font-size="11">one vertex, two corners</text>

  <g fill="none" stroke="#8b949e" stroke-width="1.4">
    <path d="M40 160 L120 60 L120 160 Z"/>
    <path d="M120 60 L200 160 L120 160 Z"/>
  </g>

  <circle cx="120" cy="60" r="5" fill="#2f81f7"/>
  <text x="120" y="48" fill="#2f81f7" text-anchor="middle" font-size="11">1 vertex</text>

  <circle cx="108" cy="76" r="3" fill="#d29922"/>
  <circle cx="132" cy="76" r="3" fill="#d29922"/>
  <text x="74" y="98" fill="#d29922" font-size="11" text-anchor="middle">uv A</text>
  <text x="166" y="98" fill="#d29922" font-size="11" text-anchor="middle">uv B</text>
  <line x1="86" y1="90" x2="104" y2="79" stroke="#d29922" stroke-width="1"/>
  <line x1="154" y1="90" x2="136" y2="79" stroke="#d29922" stroke-width="1"/>

  <text x="120" y="186" fill="#8b949e" text-anchor="middle" font-size="11">the seam is representable</text>

  <!-- arrow -->
  <text x="235" y="112" fill="#8b949e" text-anchor="middle" font-size="11">bake</text>
  <line x1="215" y1="120" x2="255" y2="120" stroke="#8b949e" stroke-width="1.2"/>
  <path d="M255 116 L263 120 L255 124 z" fill="#8b949e"/>

  <!-- render mesh: vertex split for the GPU -->
  <text x="285" y="18" fill="#8b949e" font-weight="600">render mesh</text>
  <text x="285" y="34" fill="#8b949e" font-size="11">vertex split for the GPU</text>

  <g fill="none" stroke="#8b949e" stroke-width="1.4">
    <path d="M300 160 L374 60 L374 160 Z"/>
    <path d="M386 60 L460 160 L386 160 Z"/>
  </g>

  <circle cx="374" cy="60" r="5" fill="#f85149"/>
  <circle cx="386" cy="60" r="5" fill="#f85149"/>
  <text x="380" y="48" fill="#f85149" text-anchor="middle" font-size="11">2 vertices</text>

  <text x="380" y="186" fill="#8b949e" text-anchor="middle" font-size="11">duplicated, one uv each</text>
</svg>
