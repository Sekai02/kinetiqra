<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 190" width="440" height="190"
     font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- axes -->
  <g stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="150" y1="140" x2="150" y2="34"/>
    <line x1="150" y1="140" x2="286" y2="140"/>
    <line x1="150" y1="140" x2="72" y2="176"/>
  </g>

  <circle cx="150" cy="140" r="3" fill="#8b949e"/>

  <text x="158" y="34" fill="#3fb950" font-weight="600">Y</text>
  <text x="158" y="50" fill="#8b949e" font-size="11">up</text>
  <text x="292" y="144" fill="#f85149" font-weight="600">X</text>
  <text x="52" y="186" fill="#2f81f7" font-weight="600">Z</text>
  <text x="66" y="186" fill="#8b949e" font-size="11">towards the viewer</text>

  <!-- unit tick on Y -->
  <line x1="144" y1="87" x2="156" y2="87" stroke="#8b949e" stroke-width="1.4"/>
  <text x="120" y="91" fill="#8b949e" font-size="11" text-anchor="end">1 metre</text>

  <text x="330" y="60" fill="#8b949e">right-handed</text>
  <text x="330" y="80" fill="#8b949e">Y-up</text>
  <text x="330" y="100" fill="#8b949e">1 unit = 1 metre</text>
  <text x="330" y="126" fill="#8b949e" font-size="11">conversion lives</text>
  <text x="330" y="141" fill="#8b949e" font-size="11">only in io</text>
</svg>
