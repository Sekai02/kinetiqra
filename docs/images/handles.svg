<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 240" width="470" height="240"
     font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- raw pointer -->
  <text x="0" y="14" fill="#8b949e" font-weight="600">raw pointer</text>

  <g fill="none" stroke="#8b949e" stroke-width="1.2">
    <rect x="120" y="26" width="56" height="26" rx="3"/>
    <rect x="176" y="26" width="56" height="26" rx="3"/>
    <rect x="232" y="26" width="56" height="26" rx="3"/>
  </g>
  <text x="148" y="43" fill="#8b949e" text-anchor="middle">v0</text>
  <text x="204" y="43" fill="#8b949e" text-anchor="middle">v1</text>
  <text x="260" y="43" fill="#8b949e" text-anchor="middle">v2</text>
  <text x="0" y="43" fill="#8b949e">ptr</text>
  <line x1="26" y1="39" x2="114" y2="39" stroke="#8b949e" stroke-width="1.2" marker-end="url(#h)"/>
  <line x1="204" y1="52" x2="204" y2="60" stroke="#8b949e" stroke-width="1.2"/>

  <text x="300" y="43" fill="#8b949e" font-size="11">after a topology change</text>

  <g fill="none" stroke="#8b949e" stroke-width="1.2">
    <rect x="120" y="72" width="56" height="26" rx="3"/>
    <rect x="176" y="72" width="56" height="26" rx="3"/>
    <rect x="232" y="72" width="56" height="26" rx="3"/>
  </g>
  <text x="148" y="89" fill="#8b949e" text-anchor="middle">v0</text>
  <text x="204" y="89" fill="#8b949e" text-anchor="middle">v2</text>
  <text x="260" y="89" fill="#8b949e" text-anchor="middle">v9</text>
  <line x1="26" y1="85" x2="114" y2="85" stroke="#f85149" stroke-width="1.2" marker-end="url(#h)"/>
  <text x="0" y="89" fill="#f85149">ptr</text>
  <text x="300" y="89" fill="#f85149" font-size="11">dangling, silently wrong</text>

  <line x1="0" y1="118" x2="470" y2="118" stroke="#8b949e" stroke-width="0.6" opacity="0.4"/>

  <!-- typed handle -->
  <text x="0" y="146" fill="#8b949e" font-weight="600">typed handle</text>

  <g fill="none" stroke="#8b949e" stroke-width="1.2">
    <rect x="120" y="158" width="56" height="26" rx="3"/>
    <rect x="176" y="158" width="56" height="26" rx="3"/>
    <rect x="232" y="158" width="56" height="26" rx="3"/>
  </g>
  <text x="148" y="175" fill="#8b949e" text-anchor="middle">gen 1</text>
  <text x="204" y="175" fill="#3fb950" text-anchor="middle">gen 4</text>
  <text x="260" y="175" fill="#8b949e" text-anchor="middle">gen 2</text>
  <text x="0" y="169" fill="#8b949e">VertexId</text>
  <text x="0" y="183" fill="#8b949e" font-size="11">{ 1, gen 4 }</text>
  <line x1="72" y1="171" x2="114" y2="171" stroke="#3fb950" stroke-width="1.2" marker-end="url(#h)"/>
  <text x="300" y="175" fill="#3fb950" font-size="11">generation matches, resolves</text>

  <g fill="none" stroke="#8b949e" stroke-width="1.2">
    <rect x="176" y="200" width="56" height="26" rx="3"/>
  </g>
  <text x="204" y="217" fill="#f85149" text-anchor="middle">gen 5</text>
  <text x="0" y="217" fill="#8b949e" font-size="11">{ 1, gen 4 }</text>
  <line x1="72" y1="213" x2="170" y2="213" stroke="#f85149" stroke-width="1.2" marker-end="url(#h)"/>
  <text x="300" y="217" fill="#f85149" font-size="11">stale, detected on use</text>
