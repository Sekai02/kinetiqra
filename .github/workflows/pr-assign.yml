name: PR assign

# Assigns the author to their own pull request and then requires that the pull
# request has an assignee. Both halves live in one job on purpose.
#
# Splitting them does not work. The assignment is made with GITHUB_TOKEN, and
# events triggered by GITHUB_TOKEN do not start new workflow runs — that is how
# GitHub prevents recursion. A separate check would therefore keep reporting the
# state from when the pull request was opened, which is always "no assignee",
# and neither waiting nor re-running fixes it: re-running a workflow replays the
# original event payload rather than fetching current state.
#
# For the same reason the assignees are read from the API rather than from
# github.event.pull_request.assignees, which is a snapshot taken when the event
# fired and is already stale by the time the assignment has been made.
#
# This uses pull_request_target rather than pull_request so that the token is
# writable for pull requests opened from a fork, which is where automatic
# assignment matters most — an outside contributor cannot assign themselves. It
# also means the check reports immediately for first-time contributors, whose
# pull_request workflows are held for maintainer approval.
#
# Consequence worth knowing: pull_request_target only triggers when the workflow
# file exists on the repository's default branch, and it always runs the copy
# found there — not the one on the pull request's base branch. Changes to this
# file therefore take effect only once they reach main.
#
# pull_request_target is dangerous when a workflow checks out and executes code
# from the pull request, because that code would run with a writable token.
# This one never checks anything out — it only calls the API — which is what
# makes it safe here. Do not add a checkout step.

on:
  pull_request_target:
    # `assigned`/`unassigned` matter: they are what re-runs this check when a
    # maintainer assigns by hand, which is the fallback for when the automatic
    # assignment is refused.
    types: [opened, reopened, assigned, unassigned]

permissions:
  pull-requests: write

jobs:
  assignee:
    name: Ensure the pull request has an assignee
    runs-on: ubuntu-latest
    steps:
      - name: Assign the author, then require an assignee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          # The REST endpoint is used rather than `gh pr edit --add-assignee`,
          # which goes through GraphQL and currently fails on this repository.
          assignees() {
            gh api "repos/$REPO/issues/$PR" --jq '[.assignees[].login] | join(", ")'
          }

          if [ -z "$(assignees)" ]; then
            # GitHub silently drops assignees it considers invalid, so the
            # result is verified below rather than trusting the exit status.
            gh api -X POST "repos/$REPO/issues/$PR/assignees" \
              -f "assignees[]=$AUTHOR" >/dev/null 2>&1 || true
          fi

          current="$(assignees)"

          if [ -n "$current" ]; then
            echo "OK: assigned to $current."
          else
            echo "::error::This pull request has no assignee and '$AUTHOR' could not be assigned automatically. A maintainer must assign an owner before it can be merged."
            exit 1
          fi
